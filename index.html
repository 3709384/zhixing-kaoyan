    <title>知行考研 · 网页版</title>
    <style>
      :root {
        --bg: #8fc7dc;
        --blue: #4e9dbe;
        --deep: #2f7ea3;
        --btn: #3d8cae;
        --fill: #6fb3cf;
        --tint: #eff7fa;
        --tint2: #e1f0f6;
        --tint3: #cde9f4;
        --seg-active: #dff1f8;
        --muted: #7c99a4;
        --ink: #2f3a40;
        --red: #d9534a;
        color-scheme: light;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      html { scroll-padding-bottom: calc(env(safe-area-inset-bottom) + 92px); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .num { font-variant-numeric: tabular-nums; }

      #app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }

      /* ---------- views ---------- */
      .view { display: none; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px); animation: fadein 200ms ease-out both; }
      .view.active { display: block; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

      .overlay {
        position: fixed; inset: 0; z-index: 40; background: var(--bg);
        transform: translateX(102%); transition: transform 260ms ease;
        overflow-y: auto; -webkit-overflow-scrolling: touch;
        visibility: hidden;
      }
      .overlay.open { transform: translateX(0); visibility: visible; }
      .overlay-inner { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 108px); }
      .back-row { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
      .back-btn {
        display: inline-flex; align-items: center; gap: 1px;
        background: none; border: 0; color: #fff; font-size: 16px; font-weight: 600;
        padding: 6px 8px 6px 0;
      }
      .back-btn svg { width: 20px; height: 20px; }

      /* ---------- headers ---------- */
      .header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
      .brand { font-size: 17px; font-weight: 600; color: #fff; }
      .header-date { color: rgba(255,255,255,.88); font-size: 12.5px; text-align: right; line-height: 1.45; }
      .page-title { font-size: 31px; font-weight: 700; letter-spacing: -.5px; line-height: 1.15; color: #fff; margin: 2px 0 4px; }
      .page-subtitle { color: rgba(255,255,255,.88); font-size: 13.5px; margin-bottom: 12px; }

      .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 10px; gap: 12px; }
      .section-title { font-size: 16px; font-weight: 650; color: #fff; }
      .section-more { color: rgba(255,255,255,.92); font-weight: 600; font-size: 13px; background: none; border: 0; padding: 0; white-space: nowrap; }

      /* ---------- cards ---------- */
      .card { background: #fff; border-radius: 24px; padding: 18px; }
      .form-stack { display: flex; flex-direction: column; gap: 14px; }
      .form-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .form-title { font-size: 16px; font-weight: 650; color: var(--ink); }
      .form-value { font-size: 14px; font-weight: 600; color: var(--blue); white-space: nowrap; }
      .divider { height: 1px; background: var(--tint2); margin: 13px 0; }
      .empty-box { padding: 22px 18px; color: var(--muted); font-size: 13.5px; text-align: center; }

      /* ---------- hero ---------- */
      .hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
      .hero-kicker { font-size: 14px; font-weight: 600; color: var(--blue); }
      .hero-phase { background: var(--tint3); color: var(--deep); font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; }
      .hero-score-row { display: flex; align-items: baseline; gap: 6px; }
      .hero-score { font-size: 76px; line-height: 1.05; font-weight: 800; letter-spacing: -2px; color: var(--blue); font-variant-numeric: tabular-nums; }
      .hero-score-unit { font-size: 22px; font-weight: 700; color: var(--blue); }
      .hero-label { color: var(--ink); font-size: 14px; margin-top: 4px; }
      .hero-meta { color: var(--muted); font-size: 13px; margin-top: 8px; }

      /* ---------- overview rows ---------- */
      .overview-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .overview-info { min-width: 0; flex: 1; }
      .overview-label { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
      .overview-label .done-tag { color: var(--blue); font-weight: 600; font-size: 13px; }
      .overview-value { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .overview-value .sub { color: var(--muted); }
      .overview-state { font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; }
      .overview-state.off { color: var(--muted); font-weight: 500; }
      .overview-progress { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .progress-track { width: 92px; height: 8px; border-radius: 999px; background: var(--tint2); overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 999px; background: var(--fill); transition: width 240ms ease; }
      .progress-text { font-size: 13px; font-weight: 700; color: var(--blue); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

      .tool-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
      .tool-name { display: block; font-size: 15px; font-weight: 600; }
      .tool-desc { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
      .tool-chevron { color: var(--muted); font-size: 20px; line-height: 1; }

      .quality-dots { display: flex; gap: 5px; flex: 0 0 auto; }
      .quality-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tint2); }
      .quality-dot.on { background: var(--fill); }

      .quick-card { display: flex; padding: 6px 0; }
      .quick-cell { flex: 1; background: none; border: 0; padding: 12px 2px; font-size: 14.5px; font-weight: 600; color: var(--deep); }
      .quick-divider { width: 1px; background: var(--tint2); margin: 8px 0; }

      .suggestion-row { padding: 1px 0; }
      .suggestion-title { display: block; font-size: 14.5px; font-weight: 600; }
      .suggestion-detail { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
      .advice-row { display: flex; align-items: center; gap: 12px; }
      .advice-main { flex: 1; min-width: 0; }
      .advice-link { flex: 0 0 auto; background: none; border: 0; color: var(--deep); font-size: 13.5px; font-weight: 600; padding: 6px 0 6px 6px; white-space: nowrap; }
      .advice-link:active { opacity: .6; }

      /* ---------- buttons ---------- */
      .btn-primary {
        display: flex; align-items: center; justify-content: center; width: 100%;
        height: 50px; border: 0; border-radius: 999px; background: var(--btn);
        color: #fff; font-size: 15.5px; font-weight: 600;
      }
      .btn-primary:active { opacity: .8; }
      .btn-ghost {
        display: flex; align-items: center; justify-content: center; width: 100%;
        height: 46px; border: 0; border-radius: 999px; background: #fff;
        color: var(--deep); font-size: 14.5px; font-weight: 600; margin-top: 12px;
      }
      .btn-ghost:active { opacity: .75; }
      .save-block { margin-top: 18px; }

      /* ---------- chips & segmented ---------- */
      .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .chip {
        padding: 8px 15px; border-radius: 999px; background: var(--tint); color: #5b8291;
        font-size: 13.5px; font-weight: 500; border: 0;
      }
      .chip.active { background: var(--tint3); color: var(--deep); font-weight: 600; }
      .chip.small { padding: 6px 12px; font-size: 12.5px; }
      .segmented {
        display: flex; border: 1.5px solid #bfe0ee; border-radius: 999px; padding: 3px; background: #fff; gap: 2px;
      }
      .segmented button {
        flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 4px;
        font-size: 14px; font-weight: 500; color: var(--muted); position: relative;
      }
      .segmented button.active { background: var(--seg-active); color: var(--deep); font-weight: 600; }
      .seg-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--fill); margin-left: 5px; vertical-align: 2px; }

      /* ---------- inputs ---------- */
      .ios-input, .ios-textarea {
        width: 100%; border: 0; border-radius: 14px; background: var(--tint);
        padding: 12px 14px; font-size: 14.5px; outline: none;
      }
      .ios-input::placeholder, .ios-textarea::placeholder { color: #a7bfc9; }
      .ios-textarea { min-height: 74px; resize: vertical; }
      .ios-input:focus, .ios-textarea:focus { background: var(--tint2); }

      input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0;
      }
      input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 999px; background: transparent; }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
        background: #fff; border: 1px solid var(--tint3); margin-top: -9px;
        box-shadow: 0 1px 4px rgba(47,126,163,.25);
      }
      input[type="range"]::-moz-range-track { height: 8px; border-radius: 999px; background: var(--tint2); }
      input[type="range"]::-moz-range-progress { height: 8px; border-radius: 999px; background: var(--fill); }
      input[type="range"]::-moz-range-thumb { width: 25px; height: 25px; border-radius: 50%; background: #fff; border: 1px solid var(--tint3); }

      /* ---------- study ---------- */
      .subject-task { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      .subject-progress { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      .subject-progress .progress-track { flex: 1; width: auto; }
      .timer-box { background: var(--tint); border-radius: 16px; padding: 12px 14px; margin: 12px 0; }
      .timer-display { font-size: 30px; font-weight: 700; color: var(--deep); letter-spacing: .5px; font-variant-numeric: tabular-nums; line-height: 1.1; }
      .timer-display.running { color: var(--blue); }
      .timer-actions { display: flex; gap: 8px; margin-top: 10px; }
      .timer-btn { flex: 1; border: 0; border-radius: 999px; padding: 9px 4px; font-size: 13.5px; font-weight: 600; text-align: center; }
      .timer-btn.start { background: var(--btn); color: #fff; }

      .exam-summary-title { display: block; font-size: 15.5px; font-weight: 650; margin-bottom: 6px; }
      .exam-summary-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--tint2); font-size: 14px; }

      .profile-name { display: block; font-size: 17px; font-weight: 700; }

      .range-head .val { font-weight: 700; color: var(--blue); white-space: nowrap; }

      .switch-title { display: block; font-size: 14.5px; font-weight: 600; }
      .switch-desc { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
      .switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
      .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; }
      .switch .track { position: absolute; inset: 0; border-radius: 999px; background: var(--tint2); transition: background 160ms; pointer-events: none; }
      .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform 160ms; box-shadow: 0 1px 3px rgba(47,58,64,.25); }
      .switch input:checked + .track { background: var(--fill); }
      .switch input:checked + .track::after { transform: translateX(20px); }
      .settings-action { display: block; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--tint2); padding: 14px 0; text-align: left; font-size: 14.5px; font-weight: 500; }

      /* ---------- tab bar ---------- */

      .modal-ok.danger { background: var(--red); }

      @media (prefers-reduced-motion: reduce) {
        .view, .overlay { animation: none; transition: none; }
      }

  <body>
    <div id="app">

    <script>
"use strict";
/* ================= 日期工具 ================= */
var DAY_MS = 24 * 60 * 60 * 1000;
function pad2(v) { return v < 10 ? "0" + v : "" + v; }
function dateKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseKey(key) { var p = key.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function todayKey() { return dateKey(new Date()); }
function getWeekKeys(end) { var keys = []; for (var i = 6; i >= 0; i--) keys.push(dateKey(addDays(end || new Date(), -i))); return keys; }
function weekdayLabel(key) { return ["日", "一", "二", "三", "四", "五", "六"][parseKey(key).getDay()]; }
function formatDateLabel(key) { var d = parseKey(key); return (d.getMonth() + 1) + "月" + d.getDate() + "日 · 周" + weekdayLabel(key); }
function greeting(d) { var h = (d || new Date()).getHours(); if (h < 5) return "夜深了"; if (h < 11) return "早上好"; if (h < 14) return "中午好"; if (h < 18) return "下午好"; return "晚上好"; }
function minutesToLabel(m) { m = Math.max(0, Number(m) || 0); var h = Math.floor(m / 60), mm = m % 60; if (!h) return mm + " 分钟"; if (!mm) return h + " 小时"; return h + " 小时 " + mm + " 分"; }

function defaultSettings() {
  return { studyTarget: totalTarget(getPhase()), waterTarget: 8, sleepTarget: 8, studyReminder: true, sleepReminder: true };
}
function createEmptyMeal() {
  return { mealPhoto: "", mealName: "", mealCalories: 0, mealProtein: 0, mealCarbs: 0, mealFat: 0, mealAdvice: "", mealIsDemo: false, portion: 1 };
}
function createSubjects() {
  var s = {};
  SUBJECTS.forEach(function (x) { s[x.key] = { minutes: 0, done: false, content: "", mistakes: 0 }; });
  return s;
}
function normalizeSubjects(study) {
  var out = createSubjects(), raw = (study && study.subjects) || {};
  SUBJECTS.forEach(function (x) {
    var it = raw[x.key] || {};
    out[x.key] = { minutes: Number(it.minutes) || 0, done: Boolean(it.done), content: it.content || "", mistakes: Number(it.mistakes) || 0 };
  });
  return out;
}
function normalizeDiet(diet) {
  var d = { water: 0, balance: 0, note: "", mealName: "", mealCalories: 0, mealProtein: 0, mealCarbs: 0, mealFat: 0, mealPhoto: "", mealAdvice: "", mealIsDemo: false, meals: null };
  if (diet) {
    d.water = Number(diet.water) || 0;
    d.balance = Number(diet.balance) || 0;
    if (d.balance > 2) d.balance = clamp(Math.round((d.balance / 5) * 4 - 2), -2, 2); /* 小程序 0–5 制换算 */
    d.note = diet.note || "";
  }
  var src = (diet && diet.meals) || {}, meals = {};
  MEAL_KEYS.forEach(function (k) { meals[k] = Object.assign(createEmptyMeal(), src[k] || {}); });
  var any = MEAL_KEYS.some(function (k) { return meals[k].mealName; });
  if (!any && diet && diet.mealName) {
    meals.lunch = { mealPhoto: diet.mealPhoto || "", mealName: diet.mealName || "", mealCalories: diet.mealCalories || 0, mealProtein: diet.mealProtein || 0, mealCarbs: diet.mealCarbs || 0, mealFat: diet.mealFat || 0, mealAdvice: diet.mealAdvice || "", mealIsDemo: Boolean(diet.mealIsDemo), portion: diet.portion || 1 };
  }
  d.meals = meals;
  var rec = MEAL_KEYS.map(function (k) { return meals[k]; }).filter(function (m) { return m.mealName; });
  d.mealName = rec.map(function (m) { return m.mealName; }).join(" · ");
  d.mealCalories = rec.reduce(function (s, m) { return s + (m.mealCalories || 0); }, 0);
  d.mealProtein = rec.reduce(function (s, m) { return s + (m.mealProtein || 0); }, 0);
  d.mealCarbs = rec.reduce(function (s, m) { return s + (m.mealCarbs || 0); }, 0);
  d.mealFat = rec.reduce(function (s, m) { return s + (m.mealFat || 0); }, 0);
  d.mealPhoto = rec.length ? rec[0].mealPhoto : "";
  d.mealAdvice = "";
  d.mealIsDemo = rec.some(function (m) { return m.mealIsDemo; });
  return d;
}
function createDay() {
  return {
    study: { minutes: 0, focus: 0, progress: 0, subject: "", note: "", subjects: createSubjects() },
    diet: normalizeDiet(null),
    sleep: { bed: "23:30", wake: "07:00", quality: 0, note: "" },
    recorded: { study: false, diet: false, sleep: false },
    updatedAt: 0
  };
}
function normalizeDay(day) {
  var base = createDay();
  if (!day || typeof day !== "object") return base;
  var st = day.study || {};
  var focus = Number(st.focus) || 0;
  if (focus > 0 && focus <= 5) focus = focus * 20; /* 小程序专注 1–5 制换算为 0–100 */
  base.study = { minutes: Number(st.minutes) || 0, focus: focus, progress: Number(st.progress) || 0, subject: st.subject || "", note: st.note || "", subjects: normalizeSubjects(st) };
  base.diet = normalizeDiet(day.diet);
  var sl = day.sleep || {};
  base.sleep = { bed: sl.bed || "23:30", wake: sl.wake || "07:00", quality: Number(sl.quality) || 0, note: sl.note || "" };
  var rc = day.recorded || {};
  base.recorded = { study: Boolean(rc.study), diet: Boolean(rc.diet), sleep: Boolean(rc.sleep) };
  base.updatedAt = Number(day.updatedAt) || 0;
  return base;
}
/* 由四科数据重算当天 study 的汇总字段 */
function recomputeStudy(day) {
  var subjects = day.study.subjects;
  day.study.minutes = SUBJECTS.reduce(function (s, x) { return s + (subjects[x.key].minutes || 0); }, 0);
  var phase = getPhase();
  var active = SUBJECTS.filter(function (x) { return (phase.targets[x.key] || 0) > 0; });
  var done = active.filter(function (x) { return subjects[x.key].done; }).length;
  day.study.progress = active.length ? Math.round((done / active.length) * 100) : 0;
}
function subjectListForDay(study, key) {
  var phase = getPhase(key), subjects = normalizeSubjects(study);
  return SUBJECTS.map(function (x) {
    var it = subjects[x.key], target = phase.targets[x.key] || 0;
    return { key: x.key, name: x.name, short: x.short, placeholder: x.placeholder, task: phase.tasks[x.key] || "",
      minutes: it.minutes, done: it.done, content: it.content, mistakes: it.mistakes, target: target,
      percent: target > 0 ? Math.min(100, Math.round((it.minutes / target) * 100)) : (it.minutes > 0 ? 100 : 0) };
  });
}

var store = null;
function loadStore() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (raw) { try { store = JSON.parse(raw); } catch (e) { store = null; } }
  if (!store || typeof store !== "object" || typeof store.records !== "object" || !store.records) {
    store = { records: {}, mistakes: [], settings: defaultSettings(), updatedAt: 0, createdAt: Date.now() };
  }
  if (!Array.isArray(store.mistakes)) store.mistakes = [];
  store.settings = Object.assign(defaultSettings(), store.settings || {});
  Object.keys(store.records).forEach(function (k) { store.records[k] = normalizeDay(store.records[k]); });
  store.mistakes = store.mistakes.map(normalizeMistake);
  return store;
}
function saveStore() {
  store.updatedAt = Date.now();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) { /* 存储空间不足时不阻断使用 */ }
}
function getDay(key) {
  if (!store.records[key]) store.records[key] = createDay();
  return store.records[key];
}
function getStreak() {
  var cursor = new Date(), streak = 0;
  while (true) {
    var day = store.records[dateKey(cursor)];
    if (!(day && (day.recorded.study || day.recorded.diet || day.recorded.sleep))) break;
    streak++; cursor = addDays(cursor, -1);
  }
  return streak;
}
function getRecordCount() {
  return Object.keys(store.records).filter(function (k) {
    var d = store.records[k];
    return d && d.recorded && (d.recorded.study || d.recorded.diet || d.recorded.sleep);
  }).length;
}

/* ---- 错题：同时写新旧两种字段名，保证与小程序导出互通 ---- */
function normalizeMistake(m) {
  m = m || {};
  var topic = m.topic || m.content || "";
  var created = m.createdKey || m.createdDate || todayKey();
  var next = m.nextReviewKey || m.nextDate || created;
  return {
    id: m.id || ("m" + Date.now() + Math.floor(Math.random() * 1000)),
    subject: m.subject || "math",
    topic: topic, content: topic,
    note: m.note || "",
    createdKey: created, createdDate: created,
    stage: Number(m.stage) || 0,
    nextReviewKey: next, nextDate: next,
    mastered: Boolean(m.mastered),
    reviewCount: Number(m.reviewCount) || 0
  };
}
function createMistake(subject, topic, note) {
  var key = todayKey();
  return normalizeMistake({ subject: subject, topic: topic, note: note, createdKey: key, stage: 0, nextReviewKey: dateKey(addDays(new Date(), INTERVALS[0])), mastered: false, reviewCount: 0 });
}
function reviewMistake(m) {
  var stage = m.stage || 0;
  if (stage >= INTERVALS.length - 1) {
    return Object.assign({}, m, { mastered: true, reviewCount: (m.reviewCount || 0) + 1 });
  }
  var ns = stage + 1, next = dateKey(addDays(new Date(), INTERVALS[ns]));
  return Object.assign({}, m, { stage: ns, reviewCount: (m.reviewCount || 0) + 1, nextReviewKey: next, nextDate: next });
}
function dueMistakes() {
  var t = todayKey();
  return store.mistakes.filter(function (m) { return !m.mastered && m.nextReviewKey <= t; })
    .sort(function (a, b) { return a.nextReviewKey < b.nextReviewKey ? -1 : 1; });
}

/* ---- 导出 / 导入 ---- */
function exportJSON() {
  return JSON.stringify({ app: "zhixing-kaoyan", version: 2, exportedAt: Date.now(), records: store.records, mistakes: store.mistakes, settings: store.settings }, null, 2);
}
function importJSON(text) {
  var parsed = null;
  try { parsed = JSON.parse(text); } catch (e) { return { ok: false, message: "内容不是有效的数据（JSON 解析失败）" }; }
  if (!parsed || typeof parsed !== "object" || !parsed.records || typeof parsed.records !== "object" || Array.isArray(parsed.records)) {
    return { ok: false, message: "这不是知行考研导出的数据" };
  }
  var records = {};
  Object.keys(parsed.records).forEach(function (k) { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) records[k] = normalizeDay(parsed.records[k]); });
  store.records = records;
  store.mistakes = (Array.isArray(parsed.mistakes) ? parsed.mistakes : []).map(normalizeMistake);
  if (parsed.settings && typeof parsed.settings === "object") store.settings = Object.assign(defaultSettings(), parsed.settings);
  saveStore();
  try { localStorage.removeItem(TIMER_KEY); localStorage.removeItem(EXAM_KEY); } catch (e) {}
  return { ok: true, days: Object.keys(records).length, mistakes: store.mistakes.length };
}

/* 滑杆填充色（webkit 需要手动刷背景） */
function paintRange(input) {
  var min = Number(input.min) || 0, max = Number(input.max) || 100, v = Number(input.value) || 0;
  var p = max > min ? ((v - min) / (max - min)) * 100 : 0;
  input.style.backgroundImage = "linear-gradient(90deg, var(--fill) " + p + "%, var(--tint2) " + p + "%)";
  input.style.backgroundRepeat = "no-repeat";
  input.style.backgroundPosition = "center";

function compressPhoto(file, done) {
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () {

    var canvas = document.createElement("canvas"); canvas.width = cw; canvas.height = ch;
    canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
    URL.revokeObjectURL(url);
    done(canvas.toDataURL("image/jpeg", 0.82));
  };
  img.onerror = function () { URL.revokeObjectURL(url); toast("照片读取失败，换一张试试"); };
  img.src = url;
}

/* ================= 周复盘 ================= */
var chartMode = "study";
function renderInsights() {
  var el = document.getElementById("view-insights");
  var wd = weekData(), keys = wd.keys, days = wd.days, phase = getPhase();
  var studyDays = days.filter(function (d) { return d.recorded.study; });
  var sleepDays = days.filter(function (d) { return d.recorded.sleep && sleepHoursOf(d.sleep); });
  var dietDays = days.filter(function (d) { return d.recorded.diet; });
  var recDays = days.filter(function (d) { return d.recorded.study || d.recorded.diet || d.recorded.sleep; });
  var totalWeek = studyDays.reduce(function (s, d) { return s + (d.study.minutes || 0); }, 0);
  var avgMin = studyDays.length ? Math.round(totalWeek / 7) : 0;
  var avgSleep = sleepDays.length ? Math.round(average(sleepDays.map(function (d) { return sleepHoursOf(d.sleep); })) * 10) / 10 : 0;
  var avgWater = dietDays.length ? Math.round(average(dietDays.map(function (d) { return d.diet.water || 0; }))) : 0;

  var stats = SUBJECTS.map(function (x) {
    var target = phase.targets[x.key] || 0, total = 0, doneDays = 0, mk = 0;

    var weekTarget = target * 7;
    return { key: x.key, name: x.name, total: total, doneDays: doneDays, mistakes: mk,

      '<span class="bar-label' + (k === todayKey() ? ' today' : '') + '">' + weekdayLabel(k) + '</span></div>';

  var weakestHtml = weakest && studyDays.length >= 2 && weakest.percent < 60

  el.innerHTML = '<div class="overlay-inner">' + backHeader("周复盘", "按周查看四科投入与完成情况。") +
    (new Date().getDay() === 0 ? '<div class="card empty-box" style="margin-bottom:14px">今天是周日：把本周错题、未完成任务和下周安排一起过一遍，再开始新的一周。</div>' : '') +
    '<div class="summary-grid">' +
      '<div class="card summary-card"><span class="summary-value num">' + totalWeek + '</span><span class="summary-label">本周总时长 / 分</span></div>' +
      '<div class="card summary-card"><span class="summary-value num">' + avgMin + '</span><span class="summary-label">日均 / 分</span></div>' +
      '<div class="card summary-card"><span class="summary-value num">' + getStreak() + '</span><span class="summary-label">连续记录 / 天</span></div>' +
    '</div>' +
    '<div class="card strip-card">' +
      '<div class="strip-item"><span class="strip-value num">' + recDays.length + '</span><span class="strip-label">本周记录天数</span></div><div class="strip-divider"></div>' +
      '<div class="strip-item"><span class="strip-value num">' + (avgSleep || "--") + '</span><span class="strip-label">平均睡眠 / 时</span></div><div class="strip-divider"></div>' +
      '<div class="strip-item"><span class="strip-value num">' + avgWater + '</span><span class="strip-label">平均饮水 / 杯</span></div>' +
    '</div>' +
    '<div class="section-head"><span class="section-title">四科周统计</span><span class="section-more">目标 = 每日目标 × 7</span></div>' +
    '<div class="card">' + statRows + '</div>' +
    '<div class="section-head"><span class="section-title">' + esc(month.label) + '</span><span class="section-more">本月学习 ' + month.studyDays + ' 天 · 共 ' + month.monthMinutes + ' 分钟</span></div>' +
    '<div class="card"><div class="calendar-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
    '<div class="calendar-grid">' + calCells + '</div>' +
    '<div class="calendar-legend"><span>少</span><span class="cal-cell cal-l0"></span><span class="cal-cell cal-l1"></span><span class="cal-cell cal-l2"></span><span class="cal-cell cal-l3"></span><span class="cal-cell cal-l4"></span><span>多（按当天学习分钟）</span></div></div>' +
    '<div class="section-head"><span class="section-title">近 7 天</span><span class="section-more">趋势</span></div>' +
    '<div class="card"><div class="segmented chart-segmented"><button data-chart="study" class="' + (chartMode === "study" ? 'active' : '') + '">学习时长</button><button data-chart="sleep" class="' + (chartMode === "sleep" ? 'active' : '') + '">睡眠时长</button></div>' +
    '<div class="chart-legend"><span class="legend-dot' + (chartMode === "sleep" ? ' pale' : '') + '"></span><span>' + (chartMode === "study" ? "分钟" : "小时") + '</span></div>' +
    '<div class="chart-bars">' + bars + '</div></div>' +
    '<div class="section-head"><span class="section-title">本周复盘建议</span></div>' +
    '<div class="insight-stack">' + weakestHtml + insHtml + '</div>' +
  '</div>';
}
document.getElementById("view-insights").addEventListener("click", function (e) {
  var c = e.target.closest("[data-chart]");
  if (c) { chartMode = c.dataset.chart; renderInsights(); }

/* ================= 错题本 ================= */
var mistakeFilter = "all", mistakeFormSubject = "math";
function mistakeCard(m, isDue) {
  var stageLabel = "第 " + ((m.stage || 0) + 1) + " 轮 · 间隔 " + INTERVALS[m.stage || 0] + " 天";
  return '<div class="card">' +
    '<div class="mistake-head"><span class="mistake-subject">' + esc(subjectName(m.subject)) + '</span>' +
    (isDue ? '<span class="mistake-due">待复习</span>' : '<span class="mistake-next">下次复习 ' + esc(m.nextReviewKey.slice(5)) + '</span>') + '</div>' +
    '<span class="mistake-topic">' + esc(m.topic) + '</span>' +
    (m.note ? '<span class="mistake-note">' + esc(m.note) + '</span>' : '') +
    '<span class="mistake-meta">' + esc(m.createdKey) + ' 加入 · ' + stageLabel + ' · 已复习 ' + (m.reviewCount || 0) + ' 次</span>' +
    '<div class="mistake-actions"><button class="mistake-btn review" data-mistake-review="' + m.id + '">复习完成</button>' +
    '<button class="mistake-btn master" data-mistake-master="' + m.id + '">已掌握</button>' +
    '<button class="mistake-btn delete" data-mistake-delete="' + m.id + '">删除</button></div></div>';
}
function renderMistakes() {
  var el = document.getElementById("view-mistakes");
  var all = store.mistakes, t = todayKey();
  var due = dueMistakes();
  var active = all.filter(function (m) { return !m.mastered; });
  var masteredCount = all.length - active.length;
  var list = active.filter(function (m) { return mistakeFilter === "all" || m.subject === mistakeFilter; })
    .slice().sort(function (a, b) { return a.nextReviewKey < b.nextReviewKey ? -1 : 1; });

  var subjectChips = function (cur, attr) {
    return SUBJECTS.map(function (x) { return '<button class="chip' + (cur === x.key ? ' active' : '') + '" ' + attr + '="' + x.key + '">' + esc(x.name) + '</button>'; }).join("");
  };
  el.innerHTML = '<div class="overlay-inner">' + backHeader("错题本", "未掌握 " + active.length + " 道 · 已掌握 " + masteredCount + " 道 · 复习间隔 1 / 2 / 4 / 7 / 15 / 30 天") +
    '<div class="section-head" style="margin-top:8px"><span class="section-title">今日待复习</span><span class="section-more">' + due.length + ' 道</span></div>' +
    (due.length ? '<div class="form-stack">' + due.map(function (m) { return mistakeCard(m, true); }).join("") + '</div>' : '<div class="card empty-box">今天没有到期的错题。</div>') +
    '<div class="section-head"><span class="section-title">记一道错题</span></div>' +
    '<div class="card"><div class="chip-row" style="margin-bottom:12px">' + subjectChips(mistakeFormSubject, "data-form-subject") + '</div>' +
    '<input class="ios-input" id="mistake-topic" placeholder="知识点 / 题型，例如：极限计算 · 洛必达误用" style="margin-bottom:10px" />' +
    '<input class="ios-input" id="mistake-note" placeholder="错因（可选），例如：没想到等价代换" style="margin-bottom:14px" />' +
    '<button class="btn-primary" id="mistake-add">加入错题本</button></div>' +
    '<div class="section-head"><span class="section-title">全部未掌握</span></div>' +
    '<div class="chip-row" style="margin-bottom:12px"><button class="chip' + (mistakeFilter === "all" ? ' active' : '') + '" data-mistake-filter="all">全部</button>' + subjectChips(mistakeFilter, "data-mistake-filter") + '</div>' +
    (list.length ? '<div class="form-stack">' + list.map(function (m) { return mistakeCard(m, m.nextReviewKey <= t); }).join("") + '</div>' : '<div class="card empty-box">还没有错题记录。</div>') +
  '</div>';
}
var mistakesEl = document.getElementById("view-mistakes");
mistakesEl.addEventListener("click", function (e) {
  var fs = e.target.closest("[data-form-subject]");
  if (fs) { mistakeFormSubject = fs.dataset.formSubject; renderMistakes(); return; }
  var fl = e.target.closest("[data-mistake-filter]");
  if (fl) { mistakeFilter = fl.dataset.mistakeFilter; renderMistakes(); return; }
  if (e.target.id === "mistake-add") {
    var topic = document.getElementById("mistake-topic").value.trim();
    var note = document.getElementById("mistake-note").value.trim();
    if (!topic) { toast("先写一下错题的知识点"); return; }
    store.mistakes.unshift(createMistake(mistakeFormSubject, topic, note));
    saveStore(); toast("已加入错题本，明天提醒复习"); renderMistakes(); return;
  }
  var rv = e.target.closest("[data-mistake-review]");
  if (rv) {
    var id = rv.dataset.mistakeReview, wasLast = false;
    store.mistakes = store.mistakes.map(function (m) {
      if (m.id !== id) return m;
      wasLast = (m.stage || 0) >= INTERVALS.length - 1;
      return reviewMistake(m);
    });
    saveStore(); toast(wasLast ? "最后一轮完成，已标记掌握" : "复习打卡完成，下次已推后"); renderMistakes(); return;
  }
  var ms = e.target.closest("[data-mistake-master]");
  if (ms) {
    var mid = ms.dataset.mistakeMaster;
    store.mistakes = store.mistakes.map(function (m) { return m.id === mid ? Object.assign({}, m, { mastered: true }) : m; });
    saveStore(); toast("已归档，这道题拿下了"); renderMistakes(); return;
  }
  var del = e.target.closest("[data-mistake-delete]");
  if (del) {
    var did = del.dataset.mistakeDelete;
    confirmBox("删除这道错题？", "删除后不再提醒复习。", "删除", true).then(function (ok) {
      if (!ok) return;
      store.mistakes = store.mistakes.filter(function (m) { return m.id !== did; });
      saveStore(); renderMistakes();
    });
  }
});

/* ================= 模拟考试 ================= */
var examSetup = { mode: "single", singleKey: "math", selected: { math: true, english: true, cs408: true, politics: true }, durations: { math: 180, english: 180, cs408: 180, politics: 180 } };
var examSession = null, examSummary = null;
function loadExamSession() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem(EXAM_KEY) || "null"); } catch (e) { s = null; }
  if (s && s.plan && s.dayKey === todayKey() && !s.done) { examSession = s; return s; }
  examSession = null; return null;
}
function persistExamSession() {
  try {
    if (examSession) localStorage.setItem(EXAM_KEY, JSON.stringify(examSession));
    else localStorage.removeItem(EXAM_KEY);
  } catch (e) {}
}
function examSegElapsed(now) {
  if (!examSession) return 0;
  return (examSession.segAccumSec || 0) + (examSession.running && examSession.segStart ? Math.max(0, Math.floor(((now || Date.now()) - examSession.segStart) / 1000)) : 0);
}
function beep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      var ctx = new AC(), osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880; gain.gain.value = 0.12;
      osc.start(); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.stop(ctx.currentTime + 0.65);
    }
  } catch (e) {}
  if (navigator.vibrate) { try { navigator.vibrate(200); } catch (e) {} }
}
function examBuildPlan() {
  if (examSetup.mode === "single") {
    var s = SUBJECTS.filter(function (x) { return x.key === examSetup.singleKey; })[0];
    return [{ key: s.key, name: s.name, minutes: examSetup.durations[s.key] }];
  }
  return SUBJECTS.filter(function (x) { return examSetup.selected[x.key]; })
    .map(function (x) { return { key: x.key, name: x.name, minutes: examSetup.durations[x.key] }; });
}
function examFinishSeg(auto) {
  var s = examSession; if (!s) return;
  var item = s.plan[s.index];
  if (item) s.results[item.key] = (s.results[item.key] || 0) + examSegElapsed(Date.now());
  s.segAccumSec = 0; s.segStart = null; s.running = false; s.index += 1;
  if (s.index >= s.plan.length) {
    s.done = true;
    /* 结算进今日打卡 */
    var day = getDay(todayKey()), credited = {};
    Object.keys(s.results).forEach(function (k) {
      var mins = Math.round((s.results[k] || 0) / 60);
      if (mins > 0 && day.study.subjects[k]) { day.study.subjects[k].minutes += mins; credited[k] = mins; }
    });
    if (Object.keys(credited).length) { recomputeStudy(day); day.recorded.study = true; }
    day.updatedAt = Date.now(); saveStore();
    examSummary = Object.keys(credited).map(function (k) { return { key: k, name: subjectName(k), minutes: credited[k] }; });
    examSession = null; persistExamSession();
    toast("模考完成，已计入今日打卡");
    renderExam();
    return;
  }
  s.running = true; s.segStart = Date.now();
  persistExamSession();
  if (auto) { beep(); toast("本节到时，自动进入下一节"); }
  renderExam();
}
function examTick() {
  if (!examSession || examSession.done) return;
  var item = examSession.plan[examSession.index];
  if (item && examSession.running && examSegElapsed(Date.now()) >= item.minutes * 60) { examFinishSeg(true); return; }
  if (document.getElementById("view-exam").classList.contains("open")) refreshExamLive();
}
function stopExamTick() { /* 心跳为全局单例，这里无需额外处理 */ }
function refreshExamLive() {
  if (!examSession) return;
  var item = examSession.plan[examSession.index]; if (!item) return;
  var el = examSegElapsed(Date.now()), remain = Math.max(0, item.minutes * 60 - el);
  var r = document.getElementById("exam-remain"); if (r) r.textContent = fmtClockFull(remain);
  var e2 = document.getElementById("exam-elapsed"); if (e2) e2.textContent = "已进行 " + fmtClockFull(el);
  var bar = document.getElementById("exam-progress-fill"); if (bar) bar.style.width = Math.min(100, (el / (item.minutes * 60)) * 100) + "%";
  var pb = document.getElementById("exam-pause-btn"); if (pb) pb.textContent = examSession.running ? "暂停" : "继续";
}
function renderExam() {
  var el = document.getElementById("view-exam");
  if (!examSession) loadExamSession();
  var head = backHeader("模考模式", "按节限时，实际时长自动计入今日打卡。");
  if (examSession && !examSession.done) {
    var item = examSession.plan[examSession.index];
    var elapsed = examSegElapsed(Date.now()), remain = Math.max(0, item.minutes * 60 - elapsed);
    el.innerHTML = '<div class="overlay-inner">' + head +
      '<div class="card exam-live"><span class="exam-seg">第 ' + (examSession.index + 1) + ' / ' + examSession.plan.length + ' 节</span>' +
      '<span class="exam-subject">' + esc(item.name) + '</span>' +
      '<span class="exam-remain num" id="exam-remain">' + fmtClockFull(remain) + '</span>' +
      '<span class="exam-elapsed num" id="exam-elapsed">已进行 ' + fmtClockFull(elapsed) + '</span>' +
      '<div class="exam-progress"><div class="exam-progress-fill" id="exam-progress-fill" style="width:' + Math.min(100, (elapsed / (item.minutes * 60)) * 100) + '%"></div></div>' +
      '<div class="exam-actions"><button class="exam-btn main" id="exam-pause-btn">' + (examSession.running ? "暂停" : "继续") + '</button>' +
      '<button class="exam-btn soft" id="exam-finish-btn">结束本节</button>' +
      '<button class="exam-btn plain" id="exam-quit-btn">放弃</button></div></div></div>';
    return;
  }
  var summaryHtml = "";
  if (examSummary && examSummary.length) {
    summaryHtml = '<div class="card" style="margin-bottom:14px"><span class="exam-summary-title">本场已计入今日打卡</span>' +
      examSummary.map(function (r) { return '<div class="exam-summary-row"><span>' + esc(r.name) + '</span><span class="exam-summary-min num">' + r.minutes + ' 分钟</span></div>'; }).join("") + '</div>';
  } else if (examSummary) {
    summaryHtml = '<div class="card empty-box" style="margin-bottom:14px">本场时长太短，没有计入打卡。</div>';
  }
  var modeChips = '<div class="chip-row"><button class="chip' + (examSetup.mode === "single" ? ' active' : '') + '" data-exam-mode="single">单科模考</button><button class="chip' + (examSetup.mode === "full" ? ' active' : '') + '" data-exam-mode="full">整套模考</button></div>';
  var subjectChips = SUBJECTS.map(function (x) {
    var on = examSetup.mode === "single" ? examSetup.singleKey === x.key : examSetup.selected[x.key];
    return '<button class="chip' + (on ? ' active' : '') + '" data-exam-subject="' + x.key + '">' + esc(x.name) + '</button>';
  }).join("");
  var planSubjects = examSetup.mode === "single" ? SUBJECTS.filter(function (x) { return x.key === examSetup.singleKey; }) : SUBJECTS.filter(function (x) { return examSetup.selected[x.key]; });
  var durRows = planSubjects.map(function (x) {
    return '<div class="duration-row"><span class="duration-name">' + esc(x.name) + '</span><span class="mini-stepper"><button data-dur="-15" data-key="' + x.key + '" aria-label="减少">−</button><span class="val num">' + examSetup.durations[x.key] + ' 分钟</span><button data-dur="15" data-key="' + x.key + '" aria-label="增加">＋</button></span></div>';
  }).join("");
  el.innerHTML = '<div class="overlay-inner">' + head + summaryHtml +
    '<div class="section-head" style="margin-top:8px"><span class="section-title">模式</span></div>' + modeChips +
    '<div class="section-head"><span class="section-title">' + (examSetup.mode === "single" ? "选一科" : "选择科目（可多选）") + '</span></div>' +
    '<div class="chip-row">' + subjectChips + '</div>' +
    '<div class="section-head"><span class="section-title">每节时长</span><span class="section-more">' + (examSetup.mode === "full" ? "按 数二→英二→408→政治 顺序" : "") + '</span></div>' +
    '<div class="card">' + (durRows || '<div class="empty-box">先至少选一科。</div>') + '</div>' +
    '<div class="save-block"><button class="btn-primary" id="exam-start">开始模考</button></div></div>';
}
var examEl = document.getElementById("view-exam");
examEl.addEventListener("click", function (e) {
  var mode = e.target.closest("[data-exam-mode]");
  if (mode) { examSetup.mode = mode.dataset.examMode; examSummary = null; renderExam(); return; }
  var subj = e.target.closest("[data-exam-subject]");
  if (subj) {
    var k = subj.dataset.examSubject;
    if (examSetup.mode === "single") examSetup.singleKey = k;
    else {
      examSetup.selected[k] = !examSetup.selected[k];
      if (!SUBJECTS.some(function (x) { return examSetup.selected[x.key]; })) examSetup.selected[k] = true;
    }
    renderExam(); return;
  }
  var dur = e.target.closest("[data-dur]");
  if (dur) {
    var dk = dur.dataset.key;
    examSetup.durations[dk] = clamp((examSetup.durations[dk] || 180) + Number(dur.dataset.dur), 30, 240);
    renderExam(); return;
  }
  if (e.target.id === "exam-start") {
    var plan = examBuildPlan();
    if (!plan.length) { toast("先至少选一科"); return; }
    examSummary = null;
    examSession = { plan: plan, index: 0, segAccumSec: 0, segStart: Date.now(), running: true, results: {}, done: false, dayKey: todayKey() };
    persistExamSession(); renderExam(); return;
  }
  if (e.target.id === "exam-pause-btn") {
    if (!examSession) return;
    if (examSession.running) { examSession.segAccumSec = examSegElapsed(Date.now()); examSession.running = false; examSession.segStart = null; }
    else { examSession.running = true; examSession.segStart = Date.now(); }
    persistExamSession(); refreshExamLive(); return;
  }
  if (e.target.id === "exam-finish-btn") { examFinishSeg(false); return; }
  if (e.target.id === "exam-quit-btn") {
    confirmBox("放弃这场模考？", "已进行的部分不会计入今日打卡。", "放弃", true).then(function (ok) {
      if (!ok) return;
      examSession = null; examSummary = null; persistExamSession(); renderExam();
    });
  }
});
/* ================= 历史记录 ================= */
var historyType = "study";
var HISTORY_TITLES = { study: "考研记录", diet: "饮食记录", sleep: "睡眠记录" };
function renderHistory() {
  var el = document.getElementById("view-history");
  var keys = Object.keys(store.records).sort().reverse(), rows = [];
  keys.forEach(function (key) {
    var day = store.records[key];
    if (!day || !day.recorded || !day.recorded[historyType]) return;
    var lines = [], note = "";
    if (historyType === "study") {
      var subjects = normalizeSubjects(day.study);
      var parts = SUBJECTS.filter(function (x) { return (subjects[x.key].minutes || 0) > 0; })
        .map(function (x) { return x.name + " " + subjects[x.key].minutes; });
      lines.push("共 " + (day.study.minutes || 0) + " 分钟 · 专注度 " + (day.study.focus || 0) + " / 100 · 完成度 " + (day.study.progress || 0) + "%");
      if (parts.length) lines.push(parts.join(" · "));
      note = day.study.note || "";
    } else if (historyType === "diet") {
      var diet = normalizeDiet(day.diet);
      MEAL_KEYS.forEach(function (k) {
        var mm = diet.meals[k];
        if (mm.mealName) lines.push(MEAL_LABELS[k] + "：" + mm.mealName + " · " + mm.mealCalories + " 千卡");
      });
      lines.push("全天 " + diet.mealCalories + " 千卡 · 饮水 " + (diet.water || 0) + " 杯 · " + (BALANCE_LABELS[diet.balance] || "均衡"));
      note = diet.note || "";
    } else {
      var sl = day.sleep || {}, hrs = sleepHoursOf(sl);
      lines.push((sl.bed || "--") + " – " + (sl.wake || "--"));
      lines.push((hrs || "--") + " 小时 · 质量 " + (sl.quality || 0) + " / 5");
      note = sl.note || "";
    }
    rows.push('<div class="card"><span class="history-date">' + esc(formatDateLabel(key)) + (key === todayKey() ? '<span class="today-tag">今天</span>' : '') + '</span>' +
      lines.map(function (l) { return '<span class="history-line num">' + esc(l) + '</span>'; }).join("") +
      (note ? '<span class="history-note">' + esc(note) + '</span>' : '') + '</div>');
  });
  el.innerHTML = '<div class="overlay-inner">' + backHeader(HISTORY_TITLES[historyType], "过往打卡，只读查看。") +
    (rows.length ? '<div class="form-stack">' + rows.join("") + '</div>' : '<div class="card empty-box">还没有' + HISTORY_TITLES[historyType] + '。</div>') + '</div>';
}

/* ================= 我的 ================= */
var showImport = false;
function renderMine() {
  var el = document.getElementById("view-mine"), s = store.settings;
  el.innerHTML =
    '<div class="page-title">我的</div><div class="page-subtitle">目标、提醒与数据管理。</div>' +
    '<div class="card profile-card"><div class="avatar">微</div><div><span class="profile-name">微信用户</span><span class="profile-desc">28 考研 · 数二 / 英二 / 408 / 政治</span></div></div>' +

    '<div class="section-head"><span class="section-title">目标与提醒</span></div>' +
    '<div class="card">' +
      '<div class="range-setting"><div class="range-head"><span>每日总学习目标（分钟）</span><span class="val num" id="set-study-label">' + s.studyTarget + ' 分钟</span></div>' +
      '<input type="range" min="30" max="360" step="15" value="' + s.studyTarget + '" id="set-study" aria-label="每日总学习目标" /></div>' +
      '<div class="range-setting"><div class="range-head"><span>每日饮水目标</span><span class="val num" id="set-water-label">' + s.waterTarget + ' 杯</span></div>' +
      '<input type="range" min="4" max="12" step="1" value="' + s.waterTarget + '" id="set-water" aria-label="每日饮水目标" /></div>' +
      '<div class="range-setting" style="border-bottom:0"><div class="range-head"><span>每日睡眠目标</span><span class="val num" id="set-sleep-label">' + s.sleepTarget + ' 小时</span></div>' +
      '<input type="range" min="6" max="10" step="0.5" value="' + s.sleepTarget + '" id="set-sleep" aria-label="每日睡眠目标" /></div>' +
      '<div class="switch-row"><div><span class="switch-title">考研打卡提醒</span><span class="switch-desc">每天提醒你完成四科学习计划</span></div>' +
      '<label class="switch"><input type="checkbox" id="set-study-reminder" ' + (s.studyReminder ? 'checked' : '') + ' /><span class="track"></span></label></div>' +
      '<div class="switch-row"><div><span class="switch-title">睡眠打卡提醒</span><span class="switch-desc">睡前提醒你记录睡眠状态</span></div>' +
      '<label class="switch"><input type="checkbox" id="set-sleep-reminder" ' + (s.sleepReminder ? 'checked' : '') + ' /><span class="track"></span></label></div>' +
    '</div>' +

    '<div class="section-head"><span class="section-title">数据</span></div>' +
    '<div class="card">' +
      '<button class="settings-action" id="mine-export">导出数据（下载备份文件）</button>' +
      '<button class="settings-action" id="mine-import-toggle">从备份恢复数据</button>' +
      (showImport ? '<div class="import-box"><textarea class="ios-textarea" id="import-text" placeholder="把之前导出的数据（包括小程序导出的）粘贴到这里" style="min-height:110px"></textarea><button class="btn-primary" id="mine-import-do" style="margin-top:10px">确认恢复</button></div>' : '') +
      '<button class="settings-action danger" id="mine-clear">清除本地数据</button>' +
    '</div>' +
    '<p class="hint-line">用 Safari 打开本页，点分享 →「添加到主屏幕」，<br />就能像 App 一样全屏使用。数据保存在这台设备上，建议定期导出备份。</p>';
  paintAllRanges(el);
}
var mineEl = document.getElementById("view-mine");
mineEl.addEventListener("input", function (e) {
  var t = e.target, s = store.settings;
  if (t.id === "set-study") { s.studyTarget = Number(t.value); paintRange(t); document.getElementById("set-study-label").textContent = s.studyTarget + " 分钟"; saveStore(); }
  if (t.id === "set-water") { s.waterTarget = Number(t.value); paintRange(t); document.getElementById("set-water-label").textContent = s.waterTarget + " 杯"; saveStore(); }
  if (t.id === "set-sleep") { s.sleepTarget = Number(t.value); paintRange(t); document.getElementById("set-sleep-label").textContent = s.sleepTarget + " 小时"; saveStore(); }
});
mineEl.addEventListener("change", function (e) {
  if (e.target.id === "set-study-reminder") { store.settings.studyReminder = e.target.checked; saveStore(); }
  if (e.target.id === "set-sleep-reminder") { store.settings.sleepReminder = e.target.checked; saveStore(); }
});
mineEl.addEventListener("click", function (e) {
  if (e.target.id === "mine-export") {
    var text = exportJSON();
    var copied = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("已下载备份，并复制到剪贴板"); }, function () { toast("已下载备份文件"); });
      copied = true;
    }
    var blob = new Blob([text], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "知行考研备份-" + todayKey() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
    if (!copied) toast("已下载备份文件");
    return;
  }
  if (e.target.id === "mine-import-toggle") { showImport = !showImport; renderMine(); return; }
  if (e.target.id === "mine-import-do") {
    var text = document.getElementById("import-text").value.trim();
    if (!text) { toast("先把备份数据粘贴进来"); return; }
    var result = importJSON(text);
    if (result.ok) {
      showImport = false; dietWork = null; sleepWork = null; timers = null;
      toast("恢复成功：" + result.days + " 天打卡、" + result.mistakes + " 道错题");
      renderMine();
    } else toast(result.message);
    return;
  }
  if (e.target.id === "mine-clear") {
    confirmBox("清除本地数据？", "会删掉这台设备上的全部打卡、错题和设置，无法恢复。建议先导出一份备份。", "清除", true).then(function (ok) {
      if (!ok) return;
      try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(TIMER_KEY); localStorage.removeItem(EXAM_KEY); } catch (err) {}
      loadStore(); dietWork = null; sleepWork = null; timers = null; examSession = null; examSummary = null;
      toast("本地数据已清除"); renderMine();
    });
  }
});

/* ================= 启动 ================= */
loadStore();
loadTimers();
loadExamSession();
switchTab("home");
    </script>
